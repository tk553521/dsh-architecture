name: Plugin tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit and CLI tests
        # cmd.exe and PowerShell do not expand globs, Node's test runner does.
        run: node --test --test-concurrency=1 test/*.test.mjs
